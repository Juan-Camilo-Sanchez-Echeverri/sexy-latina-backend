services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    expose:
      - "${REDIS_PORT}"
    volumes:
      - '../redis/data:/data'
    networks:
      - erotic_site

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:${REDIS_PORT}:0:${REDIS_PASSWORD}
      - HTTP_USER=${REDIS_ADMIN_USER}
      - HTTP_PASSWORD=${REDIS_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      - redis
    networks:
      - erotic_site

networks:
  erotic_site:
    name: erotic_site
    driver: bridge