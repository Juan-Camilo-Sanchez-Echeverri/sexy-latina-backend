services:
  backend:
    container_name: backend-dev
    build:
      context: ..
      dockerfile: docker/dockerfile.dev
    env_file:
      - ../.env.development
    environment:
      - TZ=America/Bogota
    volumes:
      - ../uploads:/app/uploads
    ports:
      - '${PORT}:${PORT}'
    depends_on:
      mongodb-primary:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sexy-latina-dev

  mongodb-primary:
    image: mongo:4.4
    container_name: mongodb-primary-dev
    restart: always
    volumes:
      - '../mongo-dev:/data/db'
    networks:
      - sexy-latina-dev
    command: >
      bash -c "
        mongod --replSet rs0 --bind_ip_all &
        echo 'Esperando Mongo...'
        until mongo --eval 'print(\"ready\")' >/dev/null 2>&1; do
          sleep 2
        done
        echo 'Inicializando replica set...'
        mongo --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongodb-primary:27017\" }]
          })
        ' || true
        wait
      "
    healthcheck:
      test: mongo --eval 'db.runCommand("ping").ok' --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:alpine
    container_name: redis-dev
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - '../redis-dev:/data'
    networks:
      - sexy-latina-dev

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-dev
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:${REDIS_PORT}:0:${REDIS_PASSWORD}
      - HTTP_USER=${REDIS_ADMIN_USER}
      - HTTP_PASSWORD=${REDIS_ADMIN_PASSWORD}
    ports:
      - '8082:8081'
    depends_on:
      - redis
    networks:
      - sexy-latina-dev

networks:
  sexy-latina-dev:
    name: sexy-latina-dev
    driver: bridge
