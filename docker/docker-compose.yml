services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    volumes:
      - ../uploads:/app/uploads
    networks:
      - erotic_site

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../uploads:/var/www/sexy-latina/uploads:ro
    networks:
      - erotic_site

networks:
  erotic_site:
    name: erotic_site
    driver: bridge
