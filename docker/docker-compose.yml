services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    volumes:
      - ../uploads:/app/uploads
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    environment:
      - TZ=America/Bogota
    networks:
      - erotic_site

networks:
  erotic_site:
    name: erotic_site
    driver: bridge
