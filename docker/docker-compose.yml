services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    volumes:
      - ../uploads:/app/uploads
    networks:
      - erotic_site

  nginx:
    container_name: nginx
    restart: always
    depends_on:
      - backend
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    environment:
      - PORT=${PORT}
    ports:
      - '80:80'
    volumes:
      - ../uploads:/var/www/sexy-latina/uploads:ro
    networks:
      - erotic_site

networks:
  erotic_site:
    name: erotic_site
    driver: bridge
